name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test with Maven
        run: mvn package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cen4802-jar
          path: target/*.jar